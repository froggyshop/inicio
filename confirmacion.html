<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Recibimos tu pedido! — Froggy Shop</title>
<link rel="icon" href="assets/logo-froggyshop.jpeg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="site-header"></header>

<main class="container app-width" style="padding-top: var(--space-6); padding-bottom: var(--space-7);">
  <div id="confirmation-content"></div>
</main>

<footer id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/events.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script src="js/orders.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    UI.renderHeader("pedido");
    UI.renderFooter();

    const order = OrdersAPI.getLastOrder();
    const wrap = document.getElementById("confirmation-content");

    if (!order) {
      wrap.innerHTML = `
        <div class="empty-state">
          <span class="empty-state__icon">🐸</span>
          <h3>No encontramos una solicitud reciente</h3>
          <p>Si acabas de enviar tu pedido, revisa que tu WhatsApp se haya abierto correctamente.</p>
          <a href="tienda.html" class="btn btn--primary" style="margin-top: var(--space-4); display:inline-flex;">Ir a la tienda</a>
        </div>`;
      return;
    }

    const message = OrdersAPI.buildWhatsappMessage(order);
    const waUrl = OrdersAPI.whatsappUrl(message);

    wrap.innerHTML = `
      <div style="text-align:center; margin-bottom: var(--space-5);">
        <span class="sticker sticker--mint" style="color:#3E2B36;">¡recibimos tu pedido! 🐸💌</span>
      </div>
      <h1 style="font-size:24px; text-align:center;">Solicitud #${order.id}</h1>
      <p style="text-align:center; color: var(--ink-soft);">Froggy Shop revisará tu pedido y te contactará para confirmar disponibilidad, precio final, envío y forma de pago.</p>

      <div class="card" style="margin: var(--space-5) 0;">
        <h3 style="font-size:16px;">Resumen</h3>
        ${order.items
          .map(
            (i) => `
          <div class="summary-row">
            <span>${i.qty} × ${i.name}${i.option ? " (" + i.option + ")" : ""}</span>
            <span>${i.requiresQuote ? "Cotización" : UI.formatMoney(CartAPI.subtotal(i))}</span>
          </div>`
          )
          .join("")}
        <div class="summary-row summary-row--total">
          <span>Total estimado</span>
          <span>${UI.formatMoney(order.total)}</span>
        </div>
        <p class="summary-note">Entrega: ${order.delivery === "personal" ? `Entrega personal en ${FROGGY_CONFIG.localDeliveryCity}` : "Envío a domicilio"}</p>
      </div>

      <a href="${waUrl}" class="btn btn--whatsapp btn--block" target="_blank" rel="noopener">Continuar por WhatsApp</a>
      <a href="tienda.html" class="btn btn--ghost btn--block" style="margin-top: var(--space-3);">Seguir explorando la tienda</a>
    `;
  });
</script>
</body>
</html>
