<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producto — Froggy Shop</title>
<link rel="icon" href="assets/logo-froggyshop.jpeg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="site-header"></header>

<main id="product-main">
  <div class="loading-state">Cargando producto…</div>
</main>

<footer id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/events.js"></script>
<script src="js/delivery.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script>
  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  document.addEventListener("DOMContentLoaded", () => {
    UI.renderHeader("tienda");
    UI.renderFooter();

    const id = getParam("id");
    const product = id ? ProductsAPI.byId(id) : null;
    const main = document.getElementById("product-main");

    if (!product) {
      main.innerHTML = `
        <div class="empty-state">
          <span class="empty-state__icon">🐸</span>
          <h3>Producto no encontrado</h3>
          <p>Puede que el enlace esté mal escrito o el producto ya no esté disponible.</p>
          <a href="tienda.html" class="btn btn--primary" style="margin-top: var(--space-4); display:inline-flex;">Volver a la tienda</a>
        </div>`;
      return;
    }

    document.title = `${product.name} — Froggy Shop`;

    main.innerHTML = `
      <section class="section" style="padding-bottom: var(--space-4);">
        <div class="container app-width">
          <div class="hero__media" style="max-width:none; margin-bottom: var(--space-5);">
            ${UI.productMediaHtml(product)}
          </div>

          <span class="eyebrow">${ProductsAPI.categoryLabel(product.category)}</span>
          <h1 style="font-size:24px;">${product.name}</h1>
          ${product.group ? `<p class="product-card__min">Grupo/artista: ${product.group}${product.member ? " · " + product.member : ""}</p>` : ""}
          <p>${product.description}</p>

          <div class="card" style="margin: var(--space-4) 0;">
            <div class="summary-row summary-row--total" style="border-top:none; padding-top:0;">
              <span>Precio</span>
              <span>${product.requiresQuote ? "Sujeto a cotización" : UI.formatMoney(product.price) + " / " + product.unit}</span>
            </div>
            <p class="summary-note" style="margin-top: var(--space-3);">${FROGGY_CONFIG.priceDisclaimer}</p>
          </div>

          ${product.options && product.options.length > 0 ? `
          <div class="form-field">
            <label for="opt-select">Opción</label>
            <select id="opt-select">
              ${product.options.map((o) => `<option value="${o}">${o}</option>`).join("")}
            </select>
          </div>` : ""}

          <div class="form-field">
            <label for="qty-value">Cantidad</label>
            <div class="qty-control">
              <button class="qty-btn" id="qty-minus" aria-label="Disminuir cantidad">−</button>
              <span class="qty-value" id="qty-value">${product.minOrder}</span>
              <button class="qty-btn" id="qty-plus" aria-label="Aumentar cantidad">+</button>
            </div>
            <p class="hint">Pedido mínimo: ${product.minOrder} ${product.unit}${product.minOrder > 1 ? "s" : ""}</p>
          </div>

          <div class="card" style="background: var(--mint); border:none;">
            <div class="summary-row summary-row--total" style="border-top:none; padding-top:0;">
              <span>Subtotal estimado</span>
              <span id="subtotal-value">${product.requiresQuote ? "Cotización" : UI.formatMoney(product.price * product.minOrder)}</span>
            </div>
          </div>
        </div>
      </section>

      <div class="sticky-cta">
        <div class="container app-width" style="display:flex; gap: var(--space-3);">
          <button class="btn btn--primary btn--block" id="add-to-cart">Agregar a Mi pedido</button>
        </div>
      </div>
    `;

    let qty = product.minOrder;
    const qtyEl = document.getElementById("qty-value");
    const subtotalEl = document.getElementById("subtotal-value");
    const step = 1;

    function updateSubtotal() {
      qtyEl.textContent = qty;
      if (!product.requiresQuote) {
        subtotalEl.textContent = UI.formatMoney(product.price * qty);
      }
    }

    document.getElementById("qty-minus").addEventListener("click", () => {
      qty = Math.max(product.minOrder, qty - step);
      updateSubtotal();
    });
    document.getElementById("qty-plus").addEventListener("click", () => {
      qty = qty + step;
      updateSubtotal();
    });

    document.getElementById("add-to-cart").addEventListener("click", () => {
      const optSelect = document.getElementById("opt-select");
      const option = optSelect ? optSelect.value : "";
      CartAPI.add(product, qty, option);
      const btn = document.getElementById("add-to-cart");
      btn.textContent = "¡Agregado! Ver Mi pedido →";
      btn.classList.remove("btn--primary");
      btn.classList.add("btn--whatsapp");
      btn.onclick = () => (window.location.href = "pedido.html");
    });
  });
</script>
</body>
</html>
